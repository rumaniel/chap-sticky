name: Gemini PR Review

# 두 경로로 동작한다.
#   1) PR 생성/갱신 시 자동 리뷰
#   2) PR 코멘트에 "/gemini review" 를 남기면 온디맨드 재리뷰
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: gemini-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  review:
    name: Review
    # fork PR 은 secrets 가 주입되지 않아 반드시 실패한다. 아예 돌리지 않는다.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/gemini review'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Gemini API 는 과부하 시 503 UNAVAILABLE 을 돌려준다. 설정 문제가 아니라
      # 일시 장애이므로 간격을 두고 두 번 더 시도한다.
      # TODO(임시): 사용 가능한 모델 ID 확인용. 확정되면 제거한다.
      - name: List models
        env:
          KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          curl -s -H "x-goog-api-key: $KEY"             https://generativelanguage.googleapis.com/v1beta/models             | jq -r '.models[] | select(.supportedGenerationMethods[]? == "generateContent") | .name' | sort

      - name: Review (1/3)
        id: try1
        continue-on-error: true
        uses: ./.github/actions/gemini-review
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ github.event.pull_request.number || github.event.issue.number }}
          model: ${{ vars.GEMINI_MODEL }}
          debug: ${{ vars.GEMINI_DEBUG || 'false' }}
          upload_artifacts: ${{ vars.UPLOAD_ARTIFACTS || 'false' }}

      - name: Backoff
        if: steps.try1.outcome == 'failure'
        run: sleep 45

      - name: Review (2/3)
        id: try2
        if: steps.try1.outcome == 'failure'
        continue-on-error: true
        uses: ./.github/actions/gemini-review
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ github.event.pull_request.number || github.event.issue.number }}
          model: ${{ vars.GEMINI_MODEL }}
          debug: ${{ vars.GEMINI_DEBUG || 'false' }}
          upload_artifacts: ${{ vars.UPLOAD_ARTIFACTS || 'false' }}

      - name: Backoff
        if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure'
        run: sleep 90

      # 마지막 시도는 continue-on-error 없이 — 여기서 실패하면 체크도 빨간불.
      - name: Review (3/3)
        if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure'
        uses: ./.github/actions/gemini-review
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ github.event.pull_request.number || github.event.issue.number }}
          model: ${{ vars.GEMINI_MODEL }}
          debug: ${{ vars.GEMINI_DEBUG || 'false' }}
          upload_artifacts: ${{ vars.UPLOAD_ARTIFACTS || 'false' }}
